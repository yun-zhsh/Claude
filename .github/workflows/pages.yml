# Update the data on a schedule, commit the new data back to the repository, and publish the website to GitHub Pages.
# Before first use: repository Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Update data and publish site

on:
  schedule:
    # Every 4 hours (from 01:47 UTC), i.e. 09:47, 13:47, 17:47, 21:47, 01:47 and 05:47 Hong Kong time.
    # Off the hour to reduce queueing delays; GitHub does not guarantee punctuality and may be minutes to half an hour late.
    - cron: "47 1-23/4 * * *"
  workflow_dispatch: # allow manual runs from the Actions page
  push:
    branches: [main]

permissions:
  contents: write # commit the updated data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hong_Kong # the update time shown on the pages is in Hong Kong time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Update data and export the site
        env:
          # Accessing SEC EDGAR requires identifying yourself: "program-name contact-email", set in the repository Secrets
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: valuation-monitor-export --out _site --base-path "/${{ github.event.repository.name }}"

      - name: Commit the updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update data $(date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
