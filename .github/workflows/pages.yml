# 定时更新数据，把新数据提交回仓库，并把网页发布到 GitHub Pages。
# 首次使用前：仓库 Settings → Pages → Build and deployment → Source 选择 “GitHub Actions”。
name: 更新数据并发布网页

on:
  schedule:
    # 每 4 小时一次（UTC 1:47 起），即香港时间 9:47、13:47、17:47、21:47、1:47、5:47。
    # 避开整点以减少排队延迟；GitHub 不保证准点，可能晚几分钟到半小时以上。
    - cron: "47 1-23/4 * * *"
  workflow_dispatch: # 允许在 Actions 页面手动运行
  push:
    branches: [main]

permissions:
  contents: write # 提交更新后的数据
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Hong_Kong # 页面上显示的更新时间用香港时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装
        run: pip install -e .

      - name: 更新数据并导出网页
        run: valuation-monitor-export --out _site --base-path "/${{ github.event.repository.name }}"

      - name: 提交更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据没有变化"
          else
            git commit -m "Update data $(date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
