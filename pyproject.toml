[project]
name = "valuation-monitor"
version = "0.0.1"
description = "监控股票估值水平（PE/PS/PB 等）处于历史高位还是低位"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pypdf>=4.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
valuation-monitor = "valuation_monitor.cli:main"
valuation-monitor-web = "valuation_monitor.web:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"valuation_monitor.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
