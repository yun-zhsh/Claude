[project]
name = "valuation-monitor"
version = "0.4.1"
description = "Monitor whether a stock's valuation (PE/PS/PB etc.) is high or low compared with its own history"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pypdf>=4.0",
    "flask>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mcp>=1.9,<2"]
mcp = ["mcp>=1.9,<2"]  # the MCP server for AI assistants (docs/mcp-server.md)
cloud = ["gunicorn>=22", "google-cloud-storage>=2.16"]  # serving the web page on a server (see docs/deploy-google-cloud.md)

[project.scripts]
valuation-monitor = "valuation_monitor.cli:main"
valuation-monitor-db = "valuation_monitor.legacy:main"
valuation-monitor-check = "valuation_monitor.cli:check_main"
valuation-monitor-update = "valuation_monitor.cli:update_main"
valuation-monitor-mcp = "valuation_monitor.mcp_server:main"
valuation-monitor-web = "valuation_monitor.web:main"
valuation-monitor-export = "valuation_monitor.web:export_main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"valuation_monitor.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
