# 估值监控配置
#
# 判断方法：把当前指标值放到过去若干年（lookback_years，网页上可以切换）的历史分布里，算出历史分位数，
# 再按 levels 划分成估值档位。

lookback_years: 10   # 默认选中的回看年数
lookback_options: [10, 5, 3, 2, 1]   # 网页首页下拉框里可以选的回看年数

# 估值档位：分位数 <= upper 时归入该档（按 upper 从小到大排列，最后一档 upper 应为 100）
levels:
  - { upper: 10, label: 极度低估 }
  - { upper: 30, label: 低估 }
  - { upper: 70, label: 合理 }
  - { upper: 90, label: 高估 }
  - { upper: 100, label: 极度高估 }

# 可用指标：
#   pe           PE (TTM)，按 IFRS 口径的归母净利润
#   pe_non_ifrs  PE Non-IFRS (TTM)，按公司披露的 Non-IFRS 利润，剔除投资收益等一次性项目
#   ps           PS (TTM)，市销率，按最近 4 个季度营收
#   pb           PB，市净率，按最新一期末归属股东净资产
# filing_format：业绩公告的版式，决定怎样从公告里提取数据
#   highlights  第一页有财务摘要表，每季度发布业绩（腾讯）
#   statements  只有合并损益表和资产负债表，通常每半年发布业绩（舜宇光学）
stocks:
  - symbol: 0700.HK   # Yahoo Finance 代码
    name: 腾讯控股
    filing_format: highlights
    metrics: [pe, pe_non_ifrs, ps, pb]
  - symbol: 2382.HK
    name: 舜宇光学科技
    filing_format: statements   # 舜宇只披露 HKFRS 数据，没有 Non-IFRS，所以不配 pe_non_ifrs
    metrics: [pe, ps, pb]
