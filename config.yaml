# Valuation monitor configuration
#
# Method: the current value of a metric is placed in its own distribution over the past N years (lookback_years;
# switchable on the web page) to get a historical percentile, which is then mapped to a valuation level by `levels`.

lookback_years: 10   # the number of years selected by default
lookback_options: [10, 5, 3, 2, 1]   # the number of years that can be chosen in the drop-down on the web page

# Valuation levels: a percentile <= upper falls into that level (sorted by upper ascending; the last upper must be 100)
levels:
  - { upper: 10, label: Deeply undervalued }
  - { upper: 30, label: Undervalued }
  - { upper: 70, label: Fair }
  - { upper: 90, label: Overvalued }
  - { upper: 100, label: Deeply overvalued }

# Data freshness: the update job and the scheduled workflow fail when the newest saved day is older than this many calendar days
# (the data is still saved and the site still published; the failure is what tells someone to look). Prices by market,
# long enough for weekends and holidays. Only the price and FX limits fail the run; an old newest filing is just a warning.
freshness:
  max_price_age_days: { HK: 5, US: 5, KR: 6, CN: 10 }
  max_fx_age_days: 7
  max_filing_age_days: 200

# Available metrics:
#   pe           PE (TTM), based on net profit attributable to owners under IFRS/GAAP
#   pe_non_ifrs  PE Non-IFRS (TTM), based on the company's Non-IFRS profit, which excludes one-off items such as investment gains
#   pe_non_gaap  PE Non-GAAP (TTM), based on the Non-GAAP profit disclosed by US-listed companies (excludes share-based compensation etc.); same idea as pe_non_ifrs
#   ps           PS (TTM), price to sales, based on revenue of the last 4 quarters
#   pb           PB, price to book, based on equity attributable to owners at the end of the latest period
# filing_format: the layout of the earnings filings, which decides how the data is extracted
#   highlights        a financial highlights table on the first page, results every quarter (Tencent)
#   statements        only consolidated statements, usually results every half year (Sunny Optical)
#   press_release     earnings press release (Form 6-K) filed with the SEC on EDGAR by US-listed companies, every quarter; needs a cik
#   kifrs_statements  English consolidated financial statements (K-IFRS) on the Samsung Electronics IR website, every quarter; market KR
#   cn_report         periodic reports (Q1, half-year, Q3, annual) and annual express reports of A-share companies on CNINFO (Chinese originals); market CN
# market: HK (HKEXnews; default for symbols ending in .HK), US (SEC EDGAR), KR (the IR website of a Korean company; default for
# symbols ending in .KS) or CN (A-shares, CNINFO; default for symbols ending in .SZ or .SS).
# Accessing EDGAR requires identifying yourself: before running, set the environment variable
# SEC_USER_AGENT="valuation-monitor your-email" (see the README).
# The order below is the order of the stocks on the home page and in the reports.
stocks:
  - symbol: META   # Yahoo Finance symbol
    name: Meta Platforms
    market: US
    cik: 1326801   # Meta Platforms (Facebook until 2022)
    sec_form: 8-K   # a US company: the earnings press release is exhibit 99.1 of an 8-K with item 2.02, not a 6-K
    filing_format: us_press_release   # USD, US GAAP, basic EPS
    metrics: [pe, ps, pb]
  - symbol: CTSH
    name: Cognizant Technology Solutions
    market: US
    cik: 1058290
    sec_form: 8-K
    filing_format: us_press_release
    metrics: [pe, ps, pb]
  - symbol: ASML
    name: ASML Holding (NY registry shares)
    market: US   # the NASDAQ line; one NY registry share = one ordinary share, so price and EPS need no ADS ratio
    cik: 937966
    sec_form: 6-K   # a foreign private issuer: a 6-K every quarter
    sec_exhibit: us_gaap_statements   # the press release has only a few figures; the quarterly US GAAP summary statements (EUR) have the rest
    filing_format: us_gaap_statements   # price in USD, earnings in EUR: converted with the EURUSD rate of each day
    metrics: [pe, ps, pb]

  - symbol: 005930.KS
    name: Samsung Electronics
    market: KR   # earnings come from the English consolidated financial statements (K-IFRS) on the Samsung IR website, every quarter
    filing_format: kifrs_statements   # EPS is the basic EPS of common stock (KRW); the Yahoo price is in KRW too, so no FX rate is needed
    metrics: [pe, ps, pb]
  - symbol: JD
    name: JD.com (ADR)
    market: US
    cik: 1549802   # JD.com's SEC Central Index Key
    filing_format: press_release   # the price is in USD per ADS (2 Class A ordinary shares); EPS is in RMB per ADS
    metrics: [pe, pe_non_gaap, ps, pb]
  - symbol: 0700.HK
    name: Tencent Holdings
    filing_format: highlights
    metrics: [pe, pe_non_ifrs, ps, pb]
  - symbol: 2382.HK
    name: Sunny Optical Technology
    filing_format: statements   # Sunny only discloses HKFRS figures, no Non-IFRS, so pe_non_ifrs is not configured
    metrics: [pe, ps, pb]
  - symbol: 002415.SZ
    name: Hikvision
    market: CN   # earnings come from the Chinese periodic reports and annual express reports on CNINFO (the CSRC-designated disclosure platform)
    filing_format: cn_report   # price and financials are both in RMB; the company does not disclose Non-GAAP figures
    metrics: [pe, ps, pb]
