# 估值监控配置
#
# 判断方法：把当前指标值放到过去 lookback_years 年的历史分布里，算出历史分位数，
# 再按 levels 划分成估值档位。

lookback_years: 10

# 估值档位：分位数 <= upper 时归入该档（按 upper 从小到大排列，最后一档 upper 应为 100）
levels:
  - { upper: 10, label: 极度低估 }
  - { upper: 30, label: 低估 }
  - { upper: 70, label: 合理 }
  - { upper: 90, label: 高估 }
  - { upper: 100, label: 极度高估 }

# 可用指标：
#   pe           PE (TTM)，按 IFRS 口径的归母净利润
#   pe_non_ifrs  PE Non-IFRS (TTM)，按公司披露的 Non-IFRS 利润，剔除投资收益等一次性项目
stocks:
  - symbol: 0700.HK   # Yahoo Finance 代码
    name: 腾讯控股
    metrics: [pe, pe_non_ifrs]
